[project]
name = "aees-harbor"
version = "0.1.0"
description = "AEES trajectory collection on Harbor: run ledger, ingestion, quality checks"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["aees_harbor"]

[tool.setuptools.package-data]
aees_harbor = ["browser/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
